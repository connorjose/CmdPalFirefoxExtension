name: Build and release Command Palette extension

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runtime: win-x64
          - platform: ARM64
            runtime: win-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Restore dependencies
        run: dotnet restore FirefoxExtension.sln

      - name: Build
        run: >-
          dotnet build FirefoxExtension/FirefoxExtension.csproj
          --configuration Release
          --no-restore
          --framework net9.0-windows10.0.26100.0
          --runtime ${{ matrix.runtime }}
          -p:Platform=${{ matrix.platform }}

      - name: Publish executable
        run: >-
          dotnet publish FirefoxExtension/FirefoxExtension.csproj
          --configuration Release
          --no-restore
          --framework net9.0-windows10.0.26100.0
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output artifacts/${{ matrix.runtime }}/publish
          -p:Platform=${{ matrix.platform }}

      - name: Create unsigned MSIX package
        run: >-
          dotnet publish FirefoxExtension/FirefoxExtension.csproj
          --configuration Release
          --no-restore
          --framework net9.0-windows10.0.26100.0
          --runtime ${{ matrix.runtime }}
          -p:Platform=${{ matrix.platform }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          -p:AppxPackageDir=${{ github.workspace }}/artifacts/${{ matrix.runtime }}/msix/

      - name: Archive MSIX installer bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          Compress-Archive
          -Path artifacts/${{ matrix.runtime }}/msix/*
          -DestinationPath artifacts/${{ matrix.runtime }}/cmd-pal-extension-${{ matrix.runtime }}.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmd-pal-extension-${{ matrix.runtime }}
          path: artifacts/${{ matrix.runtime }}/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/**/*.msix
            release-artifacts/**/*.zip